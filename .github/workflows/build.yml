name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NDK_VERSION: 29.0.14206865

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Android tools
        run: |
          if [[ ! -f "$ANDROID_HOME/ndk/$NDK_VERSION/source.properties" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
            "$SDKMANAGER" "ndk;$NDK_VERSION"
          fi
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - name: Verify upstream source manifest
        run: python3 scripts/verify_sources.py
      - name: Verify generated glass shaders
        run: scripts/compile_glass_shaders.sh --check
      - name: Build Android ARM64 ELF
        run: |
          ./build.sh
          file libs/arm64-v8a/AImGui
          file libs/arm64-v8a/MD3Demo
          sha256sum libs/arm64-v8a/AImGui
          sha256sum libs/arm64-v8a/MD3Demo
          cmake --install build/arm64-v8a --prefix build/md3-sdk-arm64
      - name: Build installed-SDK clock example
        run: |
          cmake -S libraries/md3 -B build/clock-sdk-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release -DQIMGUI_MD3_BUILD_SHOWCASE=OFF \
            -DQIMGUI_MD3_BUILD_ANDROID_OVERLAY=ON -DCMAKE_INSTALL_LIBDIR=lib
          cmake --build build/clock-sdk-arm64 --parallel 3
          cmake --install build/clock-sdk-arm64 --prefix build/clock-sdk-install
          cmake -S examples/md3_clock -B build/md3-clock-android \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 -DANDROID_STL=c++_static \
            -DCMAKE_BUILD_TYPE=Release \
            -DQimguiMD3_DIR="$PWD/build/clock-sdk-install/lib/cmake/QimguiMD3"
          cmake --build build/md3-clock-android --parallel 3
      - name: Test ImGui rendering under sanitizers
        run: tests/run_host_checks.sh
      - name: Test Android surface startup failure handling
        run: |
          tests/run_surface_checks.sh
          tests/run_mirror_checks.sh
          tests/run_screen_mirror_checks.sh
          tests/run_display_dump_checks.sh
          tests/run_recording_mirror_checks.sh
      - name: Test Android sensor ABI and touch slot bounds
        run: |
          tests/run_sensor_checks.sh
          tests/run_touch_checks.sh
      - name: Test fatal signal diagnostics
        run: tests/run_crash_checks.sh
      - name: Test native MD3 components under sanitizers
        run: tests/run_md3_checks.sh
      - name: Test native MaterialShapes curves and rendering
        run: tests/run_md3_shapes_checks.sh
      - name: Test Material 3 Expressive controls and motion
        run: tests/run_md3_expressive_checks.sh
      - name: Test independent MD3 library consumers and installed package
        run: tests/run_md3_package_checks.sh
      - name: Test clock SDK example state and interactions
        run: |
          tests/run_md3_clock_checks.sh
          tests/run_overlay_runtime_checks.sh
      - name: Test standalone MD3 window and examples
        run: tests/run_md3_demo_checks.sh
      - name: Test MD3 main window and saved preferences
        run: |
          tests/run_md3_main_checks.sh
          tests/run_config_checks.sh
      - name: Install software renderer for shader tests
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libegl1 libgl1-mesa-dri fonts-noto-cjk
          python3 -m pip install -r tests/requirements.txt
      - name: Render and verify GLES glass
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: python3 tests/render_glass.py --output build/glass-preview.png
      - name: Capture native MD3 component gallery
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: |
          build/md3-checks/md3-test --capture build/md3-captures tests/md3_web/fonts/Roboto-400.ttf tests/md3_web/fonts/Roboto-500.ttf
          python3 tests/render_md3.py build/md3-captures --output build/md3-native
          build/md3-demo-checks/md3-demo-test --capture build/md3-demo-captures tests/md3_web/fonts/Roboto-400.ttf tests/md3_web/fonts/Roboto-500.ttf
          python3 tests/render_md3.py build/md3-demo-captures --output build/md3-demo-preview
          build/md3-main-checks/md3-main-test --capture build/md3-main-captures tests/md3_web/fonts/Roboto-400.ttf tests/md3_web/fonts/Roboto-500.ttf
          python3 tests/render_md3_main.py build/md3-main-captures --output build/md3-main-preview
          build/md3-shapes-checks/md3-shapes-test --capture build/md3-shapes-captures tests/md3_web/fonts/Roboto-400.ttf tests/md3_web/fonts/Roboto-500.ttf
          python3 tests/render_md3.py build/md3-shapes-captures --output build/md3-shapes-preview
          build/md3-expressive-checks/md3-expressive-test --capture build/md3-expressive-captures tests/md3_web/fonts/Roboto-400.ttf tests/md3_web/fonts/Roboto-500.ttf
          python3 tests/render_md3.py build/md3-expressive-captures --output build/md3-expressive-preview
          build/md3-clock-checks/md3-clock-test --capture build/md3-clock-captures
          python3 tests/render_md3.py build/md3-clock-captures --output build/md3-clock-preview
      - uses: actions/upload-artifact@v4
        with:
          name: Qimgui-arm64-v8a
          path: |
            libs/arm64-v8a/AImGui
            libs/arm64-v8a/MD3Demo
            build/md3-sdk-arm64/
            build/md3-clock-android/MD3Clock
            build/clock-sdk-install/
            examples/md3_clock/
            tests/md3_web/fonts/OFL.txt
            third_party/material_shapes/LICENSE
            third_party/material_shapes/NOTICE
            third_party/material_expressive/toolbar_split/LICENSE
            third_party/material_expressive/toolbar_split/NOTICE
            third_party/material_expressive/button_group/LICENSE
            third_party/material_expressive/progress/LICENSE
            build/glass-preview.png
            build/md3-native/*.png
            build/md3-demo-preview/*.png
            build/md3-main-preview/*.png
            build/md3-main-preview/*.json
            build/md3-shapes-preview/*.png
            build/md3-expressive-preview/*.png
            build/md3-clock-preview/*.png
          if-no-files-found: error

  md3-web-reference:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: tests/md3_web
    env:
      MD3_REFERENCE_OUT: ../../build/md3-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/md3_web/package-lock.json
      - name: Install pinned reference dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Capture official Material Web components
        run: npm run capture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MD3-web-reference
          path: build/md3-web
          if-no-files-found: error
