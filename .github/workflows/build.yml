name: build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          echo "ANDROID_NDK_LATEST_HOME=$ANDROID_NDK_LATEST_HOME"
          cmake --version

      - name: Build AImGui (arm64-v8a)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./build.sh

      - name: Inspect ELF
        run: |
          file libs/arm64-v8a/AImGui
          ls -l libs/arm64-v8a/AImGui

      - uses: actions/upload-artifact@v4
        with:
          name: AImGui-arm64-v8a
          path: libs/arm64-v8a/AImGui
          if-no-files-found: error
