name: prepare-imgui-update

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Official stable Dear ImGui release tag
        required: true
        default: v1.93.0

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Refresh source, headers and provenance together
        env:
          IMGUI_TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/update_imgui.py "$IMGUI_TAG"
          python3 scripts/verify_sources.py
          git diff --binary -- third_party/imgui > imgui-update.patch
      - name: Check source compatibility
        run: tests/run_host_checks.sh
      - name: Check Android backend compatibility
        run: |
          if [[ ! -f "$ANDROID_HOME/ndk/29.0.14206865/source.properties" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f -print -quit)"
            "$SDKMANAGER" "ndk;29.0.14206865"
          fi
          ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865" ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: imgui-source-update
          path: imgui-update.patch
          if-no-files-found: error
