plugins {
    id 'com.android.application' version '8.5.2'
}

// Live2D Cubism character layer. OFF by default so a fresh clone builds the
// lean, model-free APK with no proprietary dependencies (matches the ELF
// build's AIMGUI_LIVE2D=OFF default). Enable the floating character with:
//   gradle :assembleRelease -Paimgui.live2d=true
// which requires the Cubism SDK under ../third_party, a model under
// ../live2d/models (see docs/LIVE2D.md), and glslc (NDK shader-tools) on PATH.
def live2d = (project.findProperty('aimgui.live2d') ?: 'false').toBoolean()

android {
    namespace 'com.aimgui.app'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.aimgui.app'
        // Live2D decodes textures with AImageDecoder (API 30+), so the model
        // build needs minSdk 30; the lean build keeps the ELF's floor of 24.
        minSdk live2d ? 30 : 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // arm64 only — the vendored libimgui.a prebuilt and the ELF build both
        // target arm64-v8a. Add more ABIs here once matching prebuilts exist.
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                if (live2d) {
                    arguments '-DANDROID_STL=c++_static', '-DAIMGUI_LIVE2D=ON'
                }
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign the release build with the debug key so the produced APK is
            // directly installable for testing without a separate keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
