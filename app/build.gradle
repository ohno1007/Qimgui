plugins {
    id 'com.android.application' version '8.5.2'
}

android {
    namespace 'com.aimgui.app'
    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'com.aimgui.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // arm64 only — the vendored libimgui.a prebuilt and the ELF build both
        // target arm64-v8a. Add more ABIs here once matching prebuilts exist.
        ndk {
            abiFilters 'arm64-v8a'
        }
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'CMakeLists.txt'
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Sign the release build with the debug key so the produced APK is
            // directly installable for testing without a separate keystore.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
